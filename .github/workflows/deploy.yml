# Manually deploy the browser playground to Cloudflare Pages.
#
# Why a GitHub Action and not native CF Pages Git integration: the `tinygpt`
# CF Pages project was originally set up as direct-upload, and CF Pages does
# not allow direct-upload projects to be retroactively connected to Git.
# Re-creating the project would require re-pointing the custom domain. This
# workflow keeps everything where it is and runs `wrangler pages deploy`
# from GitHub's runners only when explicitly dispatched.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — a Cloudflare API token with the "Pages: Edit"
#                            permission scoped to the user's account.
#                            Create at: https://dash.cloudflare.com/profile/api-tokens
#                            Use the "Edit Cloudflare Workers" template, or
#                            a custom token with: Account → Cloudflare Pages → Edit.
#   CLOUDFLARE_ACCOUNT_ID — your account ID. Found at:
#                            https://dash.cloudflare.com/ → any project sidebar.
#
# Optional GitHub secrets (analytics):
#   VITE_POSTHOG_KEY     — PostHog project API key (phc_...). When unset
#                            the analytics module logs "Analytics disabled"
#                            and the page works exactly as before. Vite
#                            inlines this at build time, so it lives in the
#                            shipped JS — that's fine, PostHog project keys
#                            are designed to be public ingest tokens.
#   VITE_POSTHOG_HOST    — optional override of the ingest host. Defaults
#                            to https://us.i.posthog.com when unset.

name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: browser/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: browser
        run: pnpm install --frozen-lockfile

      - name: Build (copy docs + tsc + astro build)
        working-directory: browser
        env:
          # Vite reads VITE_*-prefixed env vars at build time and inlines
          # them into the JS bundle. analytics.ts reads VITE_POSTHOG_KEY
          # and falls back to no-op when empty — so leaving the secret
          # unset just disables analytics; doesn't break the build.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy browser/dist --project-name=tinygpt --commit-dirty=true --branch=main
