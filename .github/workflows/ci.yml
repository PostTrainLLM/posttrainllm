# Continuous integration — build + test gate on every push and PR.
#
# Two parallel jobs:
#   browser  (Ubuntu — cheap)         tsc + astro production build
#   mac      (macOS — has Xcode)      swift build + xcodebuild test-Package
#
# What this catches that local development misses:
#   - Backtick / template-literal parse errors in HTML comments
#     (the astro build catches what `tsc --noEmit` doesn't).
#   - Drift between code and the package's checked-in lockfiles.
#   - Swift code that compiles for one architecture but not another.
#   - Tests that pass on dev's machine because of stale cache state.
#
# Triggered on:
#   - push to main (validates the head)
#   - pull_request (gates merges)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel earlier in-flight runs on the same PR/branch — we only care
# about the latest commit's verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: browser (tsc + astro build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: browser/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: browser
        run: pnpm install --frozen-lockfile

      - name: Type-check (tsc --noEmit)
        working-directory: browser
        run: pnpm run typecheck

      - name: Unit tests with coverage ratchet (vitest)
        working-directory: browser
        run: pnpm run test:coverage

      - name: Production build (copy_docs + tsc + astro build)
        working-directory: browser
        # Same env as deploy.yml — VITE_* vars get inlined; falling back
        # to empty just disables analytics, doesn't break the build.
        env:
          VITE_POSTHOG_KEY: ""
          VITE_POSTHOG_HOST: ""
        run: pnpm run build
      - name: Check bundle size
        working-directory: browser
        run: pnpm run size

  mac:
    name: mac (swift build + xcodebuild test)
    # macos-15 has Xcode 16 with the Swift / Metal toolchains the
    # MLX-Swift package needs. Older macos-13 images don't.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Show Swift + Xcode versions
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve SwiftPM dependencies
        working-directory: native-mac
        run: swift package resolve

      - name: Swift build (debug)
        working-directory: native-mac
        # `swift build` doesn't bundle the Metal library that MLX needs at
        # RUNTIME — but it DOES catch every Swift compile error. We rely
        # on the separate `xcodebuild test` step below for runtime checks.
        run: swift build

      - name: Run unit tests (xcodebuild on posttrainllm-Package)
        working-directory: native-mac
        # `xcodebuild test` produces a bundle with the Metal lib included,
        # so the Mac unit tests can actually run. -destination platform=macOS
        # uses the runner host directly (no simulator needed).
        # CLANG_ENABLE_CODE_COVERAGE=YES collects .xccoverage data for the
        # post-test extraction step.
        run: |
          xcodebuild test \
            -scheme posttrainllm-Package \
            -destination 'platform=macOS' \
            -resultBundlePath /tmp/test-result.xcresult \
            -enableCodeCoverage YES \
            CLANG_ENABLE_CODE_COVERAGE=YES \
          | xcbeautify --renderer github-actions || \
          xcodebuild test \
            -scheme posttrainllm-Package \
            -destination 'platform=macOS' \
            -resultBundlePath /tmp/test-result.xcresult \
            -enableCodeCoverage YES \
            CLANG_ENABLE_CODE_COVERAGE=YES

      - name: Extract coverage report
        working-directory: native-mac
        # Extract per-target line coverage and fail closed when Xcode does not
        # emit readable evidence. The production aggregate is ratcheted from
        # the measured 2026-08-12 baseline.
        run: |
          xcrun xccov view --report --json /tmp/test-result.xcresult > /tmp/coverage.json
          python3 scripts/check-swift-coverage.py /tmp/coverage.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: swift-coverage-report
          path: /tmp/coverage.json
          if-no-files-found: ignore

      - name: Upload test result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mac-test-result
          path: /tmp/test-result.xcresult
          retention-days: 7

  swift-quality:
    name: swift-quality (swiftformat --lint)
    # macos-15 has Homebrew preinstalled. We deliberately don't reuse the
    # `mac` job's runner: that one's slow (15+ minutes with the full test
    # matrix) and swift-quality is the fast linter we want feedback from
    # before the heavy tests finish. Each job runs on its own runner so
    # they execute in parallel.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install swiftformat
        # Homebrew is preinstalled on macos-15 runners.
        run: brew install swiftformat

      - name: swiftformat --lint
        # The `.swiftformat` at repo root pins every rule. `--lint` fails
        # the job (exit 1) on any drift; running `swiftformat` (no
        # `--lint`) locally auto-fixes. Excludes are also in `.swiftformat`,
        # so they apply both to lint and to the developer's auto-fix run.
        run: swiftformat --lint native-mac/Sources native-mac/Tests

  gallery-drift:
    name: gallery-drift (committed .bin vs regenerate)
    # WHY: Cloudflare Pages deploys with a plain `git clone` + `npm run build`
    # and NEVER runs finalize_gallery.ts. So the committed
    # browser/public/gallery/*.bin files are the source of truth at deploy
    # time — and can silently drift from the canonical data/gallery/*.tinygpt
    # training outputs if someone retrains but forgets to re-finalize + commit.
    # This job regenerates and fails on any divergence.
    #
    # IMPORTANT: data/gallery/ is gitignored (see .gitignore) and therefore
    # ABSENT on CI checkouts. With no canonical source to regenerate from, the
    # check script (browser/scripts/check_gallery_drift.mjs) detects the
    # missing dir and exits 0 with a SKIP notice — so this job is green on CI
    # today and only does real work where the training data lives (locally, or
    # a future runner that restores data/gallery). It exists so the guard is
    # wired in and ready the moment that data is present.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          # Node 22+ runs the .ts finalize scripts directly via built-in type
          # stripping (the scripts are fully erasable TS). No tsx/ts-node dep.
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: browser/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: browser
        run: pnpm install --frozen-lockfile

      - name: Check gallery artifacts match a fresh regenerate
        working-directory: browser
        # Skips gracefully (exit 0) when data/gallery is absent; fails (exit 1)
        # only when a committed .bin / manifest entry diverges from regenerate.
        run: pnpm run gallery:check

  wasm-drift:
    name: wasm-drift (committed tinygpt.{js,wasm} vs rebuild)
    # WHY: same deploy story as gallery-drift — CF Pages never runs
    # wasm/build_wasm*.sh, so the committed browser/public/tinygpt{,64}.{js,wasm}
    # are what ships. This job rebuilds them with Emscripten and fails if the
    # rebuilt bytes differ from what's committed.
    #
    # REPRODUCIBILITY CAVEAT: Emscripten output embeds the toolchain version
    # and codegen details, so byte-identical output requires the SAME emsdk
    # version that produced the committed artifacts. We pin EMSDK_VERSION
    # below. If this job's FIRST failure is a pure byte diff (not a C++ source
    # change), the committed artifacts were almost certainly built with a
    # different emsdk — reconcile once by either (a) bumping EMSDK_VERSION here
    # to match, or (b) rebuilding locally with the pinned version
    # (`bash wasm/build_wasm.sh && bash wasm/build_wasm64.sh`) and committing.
    # After that one-time reconciliation the job stays green until the C++
    # actually changes.
    runs-on: ubuntu-latest
    env:
      # Pin the Emscripten SDK so the build is reproducible run-to-run.
      # Must match the emsdk that built the committed browser/public/tinygpt*.{js,wasm}:
      # the artifacts use the `growMemViews()` glue introduced in emsdk 4.0.13, so
      # any 3.1.x pin can never byte-match. 5.0.7 reproduces all four byte-for-byte
      # (verified locally); the build is path-independent so ubuntu output matches.
      EMSDK_VERSION: "5.0.7"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Emscripten (pinned)
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          # Cache the SDK install keyed on the pinned version.
          actions-cache-folder: "emsdk-cache-${{ env.EMSDK_VERSION }}"

      - name: Show emcc version
        run: emcc --version | head -1

      - name: Rebuild WASM (wasm32 + wasm64)
        # build_wasm.sh / build_wasm64.sh write to browser/public/tinygpt*.{js,wasm}.
        # emcc is already on PATH from setup-emsdk, so the scripts' emsdk fallback
        # branch is skipped.
        run: |
          bash wasm/build_wasm.sh
          bash wasm/build_wasm64.sh

      - name: Fail if committed WASM differs from the rebuild
        # Any byte difference in the four tracked artifacts means the committed
        # copies are stale (or built with a different emsdk — see caveat above).
        run: |
          if ! git diff --exit-code --stat -- \
              browser/public/tinygpt.js \
              browser/public/tinygpt.wasm \
              browser/public/tinygpt64.js \
              browser/public/tinygpt64.wasm; then
            echo "::error::Committed WASM artifacts differ from a fresh emsdk ${EMSDK_VERSION} rebuild."
            echo "Rebuild locally with the pinned emsdk and commit:"
            echo "  bash wasm/build_wasm.sh && bash wasm/build_wasm64.sh"
            echo "Or, if only the emsdk version drifted, bump EMSDK_VERSION in .github/workflows/ci.yml."
            exit 1
          fi
          echo "✅ committed WASM matches the rebuild."

  python:
    name: python (reference impl tests + coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch numpy --index-url https://download.pytorch.org/whl/cpu
          pip install coverage

      - name: Run tests with coverage
        run: |
          coverage run --source=python_ref -m pytest tests/ -v || \
          (coverage run --source=python_ref tests/test_phase1.py && \
           coverage run --source=python_ref --append tests/test_lora.py)
          coverage report -m --fail-under=29
          coverage xml -o /tmp/python-coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: python-coverage-report
          path: /tmp/python-coverage.xml
          if-no-files-found: ignore

  code-health:
    name: code-health (static ratchets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            browser/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - name: Install static-analysis tooling
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir browser install --frozen-lockfile
          pip install lizard==1.23.0 pycycle==0.0.8 ruff==0.16.2 vulture==2.16

      - name: Check changed formatting
        env:
          CODE_HEALTH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CODE_HEALTH_SKIP_SWIFT: "1"
        run: pnpm run format:check

      - name: Lint and type-check
        env:
          CODE_HEALTH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm run lint

      - name: Check unused code
        run: pnpm run quality:unused

      - name: Check complexity
        run: pnpm run quality:complexity

      - name: Check duplication
        run: pnpm run quality:duplication

      - name: Check dependency cycles
        env:
          CODE_HEALTH_SKIP_SWIFT: "1"
        run: pnpm run quality:cycles

      - name: Audit JavaScript dependencies
        run: pnpm run quality:dependencies

  evals:
    name: evals (smoke tests)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Run eval-gate smoke test
        run: bash evals/eval-gate-smoke.sh

      - name: Run common smoke test
        run: bash evals/common-smoke.sh

      - name: Run Foundry receipt smoke test
        run: bash evals/foundry-receipt-smoke.sh

      # Also guards the committed /report-cards cohort against drifting from a
      # fresh offline compile. Uses bare swiftc over the pure TinyGPTIO
      # sources, so it needs no MLX package resolve.
      - name: Run fine-tune report card smoke test
        run: bash evals/fine-tune-report-card-smoke.sh

      - name: Run autocorrect foundation smoke test
        run: bash evals/autocorrect-foundation-smoke.sh

      # Stdlib-only here: the torch-backed adapter tests skip cleanly because
      # torch is deliberately not a dependency of this repository.
      - name: Run autocorrect adapter smoke test
        run: bash evals/autocorrect-adapter-smoke.sh

      - name: Run everyday specialist benchmark smoke test
        run: bash evals/everyday-benchmark-smoke.sh

      - name: Run capability-gradient benchmark lab smoke test
        run: bash evals/capability-gradient-lab-smoke.sh

      - name: Run cross-game arena smoke test
        run: bash evals/game-arena-smoke.sh
